<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điều Khiển Cấu Hình App</title>
    <style>
        :root {
            --primary: #4f46e5;
            --background: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { margin-top: 0; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"] {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px;
            box-sizing: border-box; font-family: monospace;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn {
            background-color: var(--primary); color: white; border: none;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .btn:hover { background-color: #4338ca; }
        .btn-success { background-color: #10b981; }
        .btn-success:hover { background-color: #059669; }
        .output-container { margin-top: 20px; }
        textarea {
            width: 100%; height: 250px; padding: 15px; font-family: monospace;
            background: #1e1e1e; color: #d4d4d4; border: none; border-radius: 5px;
            box-sizing: border-box; resize: vertical;
        }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ Bảng Điều Khiển Cấu Hình App</h1>
    
    <div class="form-group">
        <label>WEBVIEW_URL</label>
        <input type="text" id="webview_url" value="https://m.newdomain.com/" placeholder="https://...">
    </div>
    <div class="form-group">
        <label>SUPPORT_URL</label>
        <input type="text" id="support_url" value="https://t.me/cskh" placeholder="Link CSKH">
    </div>

    <h3 style="margin-top: 30px;">Thông Tin Ngân Hàng</h3>
    <div class="grid">
        <div class="form-group">
            <label>Mã Ngân Hàng (bankId)</label>
            <input type="text" id="bank_id" value="VCB">
        </div>
        <div class="form-group">
            <label>Tên Ngân Hàng (bankName)</label>
            <input type="text" id="bank_name" value="Vietcombank">
        </div>
        <div class="form-group">
            <label>Số Tài Khoản (accountNumber)</label>
            <input type="text" id="account_number" value="9999999999">
        </div>
        <div class="form-group">
            <label>Tên Chủ Tài Khoản (accountHolder)</label>
            <input type="text" id="account_holder" value="NGUYEN VAN A">
        </div>
        <div class="form-group">
            <label>Nội Dung Chuyển Khoản (transferNote)</label>
            <input type="text" id="transfer_note" value="NAP TIEN">
        </div>
        <div class="form-group">
            <label>Template (template QR)</label>
            <input type="text" id="template" value="compact2">
        </div>
    </div>

    <div class="actions">
        <button class="btn" onclick="generateConfig()">🔄 Tạo Code Cấu Hình</button>
    </div>

    <div class="output-container">
        <label>Nội dung file public/controll/config.js (Copy lên Server):</label>
        <textarea id="output_code" readonly></textarea>
        <div class="actions">
            <button class="btn btn-success" onclick="copyCode()">📋 Copy Code</button>
            <button class="btn btn-success" onclick="downloadConfig()">⬇️ Tải file config.js</button>
        </div>
    </div>
</div>

<script>
    function generateConfig() {
        const config = {
            WEBVIEW_URL: document.getElementById('webview_url').value,
            SUPPORT_URL: document.getElementById('support_url').value,
            BANK_INFO: {
                bankId: document.getElementById('bank_id').value,
                bankName: document.getElementById('bank_name').value,
                accountNumber: document.getElementById('account_number').value,
                accountHolder: document.getElementById('account_holder').value,
                transferNote: document.getElementById('transfer_note').value,
                template: document.getElementById('template').value,
            }
        };

        const jsCode = `// Tệp cấu hình tự động cập nhật cho App
window.HB88_CONFIG = ${JSON.stringify(config, null, 2)};
`;
        document.getElementById('output_code').value = jsCode;
    }

    function copyCode() {
        const copyText = document.getElementById("output_code");
        copyText.select();
        document.execCommand("copy");
        alert("Đã copy mã cấu hình!");
    }

    function downloadConfig() {
        const text = document.getElementById("output_code").value;
        if (!text) {
            alert("Vui lòng Tạo code cấu hình trước!");
            return;
        }
        const blob = new Blob([text], { type: "text/javascript" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "config.js";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Tự động tạo lần đầu khi mở trang
    window.onload = generateConfig;
</script>

</body>
</html>
